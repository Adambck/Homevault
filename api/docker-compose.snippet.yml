# Add this service to your existing docker-compose (or the section
# generated by install.sh). Mount the Docker socket so the API can
# control the other containers, and persist the token file.

  homevault-api:
    image: homevault-api:latest       # or build from ./api
    container_name: homevault-api
    build: ./api
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - homevault_api_data:/data
    # Needed for /api/system/reboot — remove if you don't want that feature
    privileged: false                 # keep false; reboot uses host PID via cap
    cap_add:
      - SYS_BOOT
    networks:
      - homevault

volumes:
  homevault_api_data:
